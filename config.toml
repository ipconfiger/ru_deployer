[gitlab]
url = "http://172.16.29.88:30080"
# 也可通过 RU_DEPLOYER_GITLAB_TOKEN 环境变量覆盖，避免写入文件
token = ""

[deploy]
mode = "multi"
scripts_dir = "./scripts"
src_dir = "./src"
# 脚本执行超时（秒）
script_timeout_secs = 1800
# release 触发过滤：只处理以该前缀开头的 release tag（建议带分隔符，如 "gpu-" 而非 "gpu"），
# 用于多个 deployer 实例共享同一仓库时区分
# release_prefix = "gpu-"
# 单项目模式专用 (events / commits)
# project = "dev-team/api"
# commits 模式专用
# branch = "main"

[filter]
file = "./filter.toml"

[notify]
msg_platform_url = "http://172.16.42.213:8081"
notify_author = true
cc = []

[harbor]
# Harbor registry 认证（Rust 统一注入子进程 push_harbor.sh，含 registry/project/user/password 四个变量）
# 也可通过 RU_DEPLOYER_HARBOR_* 环境变量覆盖；HARBOR_PASSWORD 环境变量作为 password 的兜底来源
registry = "172.16.29.88:30800"
project = "gpu"
user = "robot$gpu+gpubot"
password = ""

[logging]
level = "info"
output = "stdout"
# output = "file" 时需要
# file = "/var/log/ru_deployer.log"

[database]
path = "./data/deploy.db"
