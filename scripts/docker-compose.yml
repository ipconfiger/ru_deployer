# =============================================================================
# 统一 docker-compose — 四个项目 + 共享基础设施
# 内网: internal (服务名即地址)
# =============================================================================

networks:
  internal:
    driver: bridge

# =============================================================================
# 共享基础设施
# =============================================================================
services:

  mysql:
    image: mysql:8.0
    networks:
      - internal
    environment:
      MYSQL_ROOT_PASSWORD: sH_9527!
      MYSQL_USER: sh_admin
      MYSQL_PASSWORD: sH_9527!
      MYSQL_DATABASE: sh_admin
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sh_admin", "-psH_9527!"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - internal
    command: redis-server --requirepass sH_9527!
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "sH_9527!", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    networks:
      - internal
    environment:
      RABBITMQ_DEFAULT_USER: sh_admin
      RABBITMQ_DEFAULT_PASS: sH_9527!
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- ClickHouse（API token-audit 计费用量存储） ---
  # 备注（已记录、暂不实现）:
  #   1. token-audit 服务未加入本 compose —— 消费 clickhouse 用量的独立服务，暂不部署
  #   2. dogress.token_usage 表未自动初始化 —— 需手动执行 src/api/<tag>/scripts/clickhouse-init.sql
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    networks:
      - internal
    environment:
      CLICKHOUSE_USER: sh_admin
      CLICKHOUSE_PASSWORD: sH_9527!
      CLICKHOUSE_DB: dogress
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "-u", "sh_admin", "--password", "sH_9527!", "-q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- API（Rust, 端口 3000） ---
  api:
    image: api:latest
    networks:
      - internal
    ports:
      - "3001:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://sh_admin:sH_9527!@mysql:3306/sh_admin"
      DATABASE_MAX_CONNECTIONS: "10"
      REDIS_URL: "redis://:sH_9527!@redis:6379/0"
      RABBITMQ_URL: "amqp://sh_admin:sH_9527%21@rabbitmq:5672/%2f"
      JWT_SECRET: "dev-secret-change-in-production-32bytes!"
      JWT_EXPIRATION_HOURS: "4"
      AES_KEY_BASE64: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "3000"
      STATIC_RESOURCE_CONFIG: "/app/static_resources.yaml"
      RUST_LOG: "info"
      TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
      WEBRIFY_HMAC_KEY: "dev-webrify-hmac-key-change-in-production"
      WEBRIFY_JWT_KEY: "dev-webrify-jwt-secret-at-least-32-bytes!!"
      WEBRIFY_ALLOWED_ORIGINS: "*"
    volumes:
      - ../src/api/mysql_db/api_release/static_resources.yaml:/app/static_resources.yaml:ro
    restart: unless-stopped

  # --- Flint（Rust gRPC, 端口 50051/9091） ---
  flint:
    image: flint:latest
    networks:
      - internal
    ports:
      - "50051:50051"
      - "9091:9091"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # OpenStack 认证
      OS_AUTH_URL: "http://172.16.29.18:5000/v3"
      OS_USERNAME: "alex"
      OS_PASSWORD: "Alex@2026"
      OS_PROJECT_NAME: "T_3746"
      OS_USER_DOMAIN_NAME: "Default"
      OS_PROJECT_DOMAIN_NAME: "Default"
      OS_REGION_NAME: "RegionOne"
      OS_INTERFACE: "public"
      OPENSTACK_PASSWORD: "Alex@2026"
      OPENSTACK_AUTH_ENABLED: "true"
      # Flint 服务端口
      FLINT_GRPC_LISTEN: "0.0.0.0:50051"
      FLINT_ADMIN_GRPC_LISTEN: "127.0.0.1:50052"
      FLINT_METRICS_LISTEN: "0.0.0.0:9091"
      FLINT_ADMIN_TOKEN: "flint-admin-change-me"
      FLINT_RECONCILE_INTERVAL_SECS: "300"
      # 队列
      FLINT_QUEUE_CAPACITY: "32"
      FLINT_ALLOCATION_TIMEOUT_SECS: "600"
      # 重试
      FLINT_RETRY_MAX: "3"
      FLINT_RETRY_BASE_DELAY_MS: "1000"
      FLINT_RETRY_MAX_DELAY_MS: "10000"
      # Redis
      FLINT_REDIS_URL: "redis://:sH_9527!@redis:6379"
      FLINT_REDIS_POOL_SIZE: "16"
      FLINT_INVENTORY_BACKEND: "memory"
      # 日志
      FLINT_LOG_LEVEL: "info"
      FLINT_LOG_FORMAT: "json"
      RUST_LOG: "info"
    volumes:
      - flint_data:/var/lib/flint
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  # --- Horizon（Node/Nitro 前端, 端口 3000） ---
  horizon:
    image: horizon:latest
    networks:
      - internal
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: "production"
      # Server-side session encryption key (>= 32 chars)
      SESSION_SECRET: "94b6c3b0b76544ff7995c5f8109fd241ea24e50e5904e5ac9c524ac0b9d52182"
      # Log level: debug | info | warn | error (default: info)
      LOG_LEVEL: "info"
      # ---- Backend microservices (runtime) ----
      HORIZON_API_ENDPOINT: "http://api:3000"
      HORIZON_MANAGER_API_ENDPOINT: "http://api-manager-platform:8080"
      HORIZON_CHAT_API_ENDPOINT: "https://api.do.top/v1"
      HORIZON_CMS_API_ENDPOINT: "http://172.16.42.32:8080"
      PLAYGROUND_API_ENDPOINT: "http://172.16.42.36:3001/v1"
    restart: unless-stopped

  # --- API Manager Platform（Go 后端 + 前端, 端口 8080） ---
  api-manager-platform:
    image: api-manager-platform:latest
    networks:
      - internal
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # ── Server ──
      SERVER_PORT: "8080"
      SERVER_FRONTEND_DIR: "/var/www/frontend"
      SERVER_ALLOWED_ORIGINS: "*"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"

      # ── Shared DB（用户账户 / Token 批次 / 交易流水 / 钱包，与 api 共享 sh_admin 库） ──
      SHARED_DB_HOST: "mysql"
      SHARED_DB_PORT: "3306"
      SHARED_DB_USER: "sh_admin"
      SHARED_DB_PASSWORD: "sH_9527!"
      SHARED_DB_NAME: "sh_admin"
      SHARED_DB_AUTO_MIGRATE: "true"

      # ── Platform DB（管理端表：产品 / 模型 / 裸金属 / 定价 / 活动） ──
      PLATFORM_DB_HOST: "mysql"
      PLATFORM_DB_PORT: "3306"
      PLATFORM_DB_USER: "sh_admin"
      PLATFORM_DB_PASSWORD: "sH_9527!"
      PLATFORM_DB_NAME: "platform_admin"
      PLATFORM_DB_AUTO_MIGRATE: "true"

      # ── Flint（裸金属 GPU 管理） ──
      FLINT_GRPC_ADDR: "flint:50051"
      FLINT_REQUEST_TIMEOUT: "10s"
      FLINT_RECONCILE_INTERVAL: "5m"

      # ── Dogress（API 网关） ──
      DOGRESS_ADMIN_URL: "${DOGRESS_ADMIN_URL:-http://dogress:9080}"
      DOGRESS_USERNAME: "${DOGRESS_USERNAME:-admin}"
      DOGRESS_PASSWORD: "${DOGRESS_PASSWORD:-dogress2024}"
      DOGRESS_SYNC_INTERVAL: "${DOGRESS_SYNC_INTERVAL:-5m}"
      DOGRESS_REQUEST_TIMEOUT: "${DOGRESS_REQUEST_TIMEOUT:-10s}"
    restart: unless-stopped

  # --- Dogress（Rust Pingora LLM 代理, 端口 7000/9080；admin_listen 仅回环） ---
  dogress:
    image: dogress:latest
    networks:
      - internal
    ports:
      - "7000:7000"
      - "9080:9080"
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      # Admin Web 登录凭据（api-manager-platform 经 DOGRESS_USERNAME/PASSWORD 登录）
      ADMIN_WEB_USER: "admin"
      ADMIN_WEB_PASS: "dogress2024"
      ADMIN_WEB_JWT_SECRET: "change-this-to-a-random-string"
    volumes:
      - ./dogress.yaml:/app/dogress.yaml:ro
      - dogress_data:/app/data
    restart: unless-stopped

# =============================================================================
# 持久化卷
# =============================================================================
volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  flint_data:
  clickhouse_data:
  dogress_data:
