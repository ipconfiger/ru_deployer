# /etc/logrotate.d/ru_deployer — 日志轮转配置
#
# ru_deployer 以 systemd append 模式写 /var/log/ru_deployer.log，
# systemd 持续持有 fd，因此必须用 copytruncate（不能用 create/rename）。
#
# 安装（目标机）:
#   cp docs/logrotate-ru_deployer.conf /etc/logrotate.d/ru_deployer
#
# 调试:
#   logrotate -d /etc/logrotate.d/ru_deployer   # dry-run
#   logrotate -f /etc/logrotate.d/ru_deployer   # 强制轮转一次
#
/var/log/ru_deployer.log {
    daily
    rotate 14
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
}
